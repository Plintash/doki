name: Terminal drop diagnosis

on:
  push:
    branches: [diagnostic/terminal-drop-phases]

permissions:
  contents: read

concurrency:
  group: terminal-drop-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Flooded PTY drop (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@v6

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Cache core-test dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-terminal-drop-rust-1.96.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-terminal-drop-rust-1.96.0-
            macos-latest-rust-1.96.0-cargo-

      - name: Build only core tests
        run: |
          mkdir -p terminal-drop-evidence
          cargo test --locked --package waku-core --lib --no-run --message-format=json > terminal-drop-evidence/build.jsonl

      - name: Repeat original flood deadline and check server interactions
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          evidence = pathlib.Path("terminal-drop-evidence")
          artifacts = [json.loads(line) for line in (evidence / "build.jsonl").read_text().splitlines() if line.startswith("{")]
          binaries = [item["executable"] for item in artifacts if item.get("reason") == "compiler-artifact" and item.get("target", {}).get("name") == "waku_core" and item.get("profile", {}).get("test") and item.get("executable")]
          assert len(binaries) == 1, binaries
          binary = binaries[0]
          test = "server::tests::dropping_flooding_terminal_terminates_pipeline_group"

          def run(label, args, budget):
              with (evidence / f"{label}.log").open("w") as output:
                  try:
                      result = subprocess.run([binary, *args], stdout=output, stderr=subprocess.STDOUT, timeout=budget)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      output.write(f"\nOuter diagnostic process deadline exceeded: {budget}s\n")
                      code = 124
              print((evidence / f"{label}.log").read_text(), flush=True)
              if code:
                  sys.exit(code)

          for attempt in range(1, 101):
              print(f"Flood attempt {attempt}/100", flush=True)
              run(f"flood-{attempt:03}", [test, "--exact", "--nocapture"], 30)
          # A separate pass retains the runner's normal test parallelism and
          # neighboring server activity without invoking provider-live tests.
          # PR95's independent attach-boundary fixture is repaired in PR96;
          # this diagnostic branch deliberately leaves both PR heads alone.
          run("server-tests", ["server::tests::", "--nocapture", "--skip", "websocket_terminal_attach_boundary_has_no_duplicates_or_gaps"], 180)
          PY

      - name: Preserve phase and native stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-drop-evidence
          path: terminal-drop-evidence
          if-no-files-found: warn
