name: macOS preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  CARGO_TERM_COLOR: always

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Apple Silicon app
    # Standard M1 runner, not the paid macos-*-large/xlarge runner.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Ensure GPUI Metal compiler is available
        run: |
          xcodebuild -version
          if ! xcrun --toolchain Metal metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --toolchain Metal metal --version
      - name: Test preview packaging contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_preview.py'
      - name: Build and verify app archive
        run: ./scripts/package-preview.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: Doki-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Download instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "### Apple Silicon preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download archive, manifest and checksums]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Ad-hoc signed, not notarized. See INSTALL.txt. PR builds use GitHub's test merge commit; the manifest records the exact commit." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish main prerelease
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Plintash/doki'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout and no execution of downloaded app or repository scripts in
      # this privileged job. PR jobs never receive write permission or secrets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Doki-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets
      - name: Publish unique preview (never overwrite a stable release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > notes.txt <<EOF_NOTES
          Apple Silicon macOS preview of commit $COMMIT.
          Download Doki-macos-arm64-*.zip below, extract Doki.app and move it to Applications.
          Ad-hoc signed, not Apple-notarized: read INSTALL.txt before opening.
          Uses existing Doki data; quit other copies and back up before switching builds.
          Provider CLIs must be installed/authenticated separately. No automatic updates.
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF_NOTES
          gh release create "$tag" assets/* --target "$COMMIT" \
            --title "Main preview ${COMMIT:0:12}" --notes-file notes.txt \
            --prerelease --latest=false
